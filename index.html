<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Metadados básicos: charset, viewport para responsividade, título -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Link para o CSS personalizado -->
    <link rel="stylesheet" href="./styles.css" />
    <!-- Importação de fontes do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <title>I.A Gerador CSS</title>
</head>

<body>
    <!-- Container principal que envolve todo o conteúdo -->
    <div class="container">

        <!-- Cabeçalho com título e descrição -->
        <header>
            <h1>Gerador de CSS com <span class="destaque">I.A</span><span class="icone">⚡</span></h1>
            <p>Digite o que deseja e obtenha o código CSS correspondente!</p>
        </header>

        <!-- Seção de entrada: textarea para descrição e botão de gerar -->
        <section id="input-section">
            <label for="prompt" id="label-prompt">Descreva o estilo desejado:</label>
            <textarea name="prompt" id="prompt" placeholder="Ex: Bola azul pingando..." autocomplete="off"></textarea>
            <button type="button" id="btn-gerar">Gerar CSS ⚡</button>
        </section>

        <!-- Seção principal: código gerado e preview lado a lado -->
        <main>
            <!-- Seção de saída: exibe o código CSS gerado -->
            <section id="output-section">
                <label id="label-output">Código CSS gerado:</label>
                <div id="output">
                    <p class="code-paragraph"></p>
                </div>
            </section>

            <!-- Seção de preview: iframe para visualizar o resultado -->
            <section id="preview-section">
                <label for="preview-iframe">Preview ao vivo:</label>
                <iframe id="preview-iframe" style="width:100%; height:400px;"></iframe>
            </section>
        </main>

    </div>
    <!-- Script JavaScript para funcionalidade -->
    <script src="./config.js"></script>
    <script src="./scripts.js"></script>

</html>
